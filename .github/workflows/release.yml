name: Release

# Jalankan dengan membuat tag, mis: git tag v1.0.0 && git push origin v1.0.0
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Samakan versi pom dengan tag
        run: mvn -B -ntp versions:set -DnewVersion="${GITHUB_REF_NAME#v}" -DgenerateBackupPoms=false
      - name: Build
        run: mvn -B -ntp package
      - name: Buat GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: target/ValenceIntro-*.jar
          generate_release_notes: true
