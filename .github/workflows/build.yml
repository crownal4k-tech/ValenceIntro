name: Build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build
        run: mvn -B -ntp package
      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: ValenceIntro
          path: target/ValenceIntro-*.jar
